; One firmware for both CYD variants: the display controller (ILI9341 on the original
; CYD, ST7789 on the CYD2USB with USB-C port) is detected at boot (drivers/display_panel.*).
; Host unit tests: pio test -e native (Linux/macOS/CI, gcc in PATH) or
; pio test -e native-win (Windows, PlatformIO's bundled MinGW).
[platformio]
default_envs = esp32-2432S028R

; Shared settings of the ESP32 builds.
[esp32]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Git branch/commit and build time for src/utils/build_info.cpp (only that file is rebuilt).
extra_scripts =
  pre:tools/build_info.py
  ; Web UI from data/www embedded gzip-compressed (S55): $BUILD_DIR/www/www_assets.h
  pre:tools/embed_www.py
  ; __FILE__ without local paths (no home directory in the image): tools/prefix_map.py
  pre:tools/prefix_map.py

lib_deps =
  ; Exact version: drivers/display_detect.cpp copies its ST7789 init sequence.
  bodmer/TFT_eSPI@2.5.43
  lvgl/lvgl@8.4.0
  ; Pinned by commit (tag v1.4), audit S-20.
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
  ; SCPI parser (W-E12): v2.3 plus two build fixes (strings.h, -Wdouble-promotion), pinned
  ; by commit (S-20). Only the library core is used, no example code (issue #174).
  https://github.com/j123b567/scpi-parser.git#886615902b2777b71860445305bfe5a3faef4f3e
  ; REST and WebSocket JSON (ARBEITSPLAN 3.3, W-S8), exact version (S-20).
  bblanchon/ArduinoJson@7.4.3
  ; Web server (S55, P-9): exact versions of the ESP32Async organisation (S-20, W-S24).
  esp32async/AsyncTCP@3.5.0
  esp32async/ESPAsyncWebServer@3.12.1

build_flags =
  ; Errors only: the I2C detection re-initializes the bus, which logs at info level.
  -DCORE_DEBUG_LEVEL=1
  -DLV_CONF_INCLUDE_SIMPLE
  ; scpi-parser reads include/scpi_user_config.h
  -DSCPI_USER_CONFIG=1
  ; WebSocket push (S55): at most 4 queued messages per client (heap), the state is resent later
  -DWS_MAX_QUEUED_MESSAGES=4
  -I include
  -I .
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=13
  -DTFT_MISO=12
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  ; Silences TFT_eSPI's optional touch warning. Actual touch is handled by
  ; PaulStoffregen/XPT2046_Touchscreen on VSPI, not by TFT_eSPI.
  -DTOUCH_CS=33
  -DUSE_HSPI_PORT
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  ; No TFT_eSPI fonts (LOAD_GLCD, LOAD_FONTn, SMOOTH_FONT): all text is drawn by LVGL.

; Warnings for the own sources only (libraries keep their defaults); src/ must stay at 0.
build_src_flags = -Wall -Wextra

board_build.partitions = huge_app.csv
; The tests in test/ run on the host only.
test_ignore = *

; Both boards. TFT_eSPI is built for the ILI9341 (SPI mode 0); DisplayPanel switches
; an ST7789 to its own init sequence. -DDISPLAY_FORCE_PANEL=1|2 skips the detection.
; espressif32 8.0.0 = Arduino 3.3.12 / ESP-IDF 5.5.5, the only platform since 2026-11-09 (E-32).
; Its PlatformIO build script sets no optimization (the Arduino IDE adds -Os via platform.txt):
; without it the sources are built with -O0 and LVGL draws 4x slower. It also defines
; CORE_DEBUG_LEVEL=0 itself; ours (errors only) replaces it.
[env:esp32-2432S028R]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DILI9341_DRIVER=1
  -Os
build_unflags = -DCORE_DEBUG_LEVEL=0

; Touch test builds for MESSPLAN B8, B9, B12 (not built by a plain `pio run`, never released):
; normal GUI with one log line per touch, and the hit map with the touch log.
[env:esp32-2432S028R-touchlog]
extends = env:esp32-2432S028R
build_flags =
  ${env:esp32-2432S028R.build_flags}
  -DTEST_TOUCH_LOG=1

[env:esp32-2432S028R-hitmap]
extends = env:esp32-2432S028R
build_flags =
  ${env:esp32-2432S028R.build_flags}
  -DTEST_HIT_MAP=1

; Host unit tests: the hardware-independent sources run against the fakes in
; test/fakes (Arduino core, Wire with an SI5351 register model, Preferences).
[native_test]
test_framework = unity
test_build_src = yes
lib_deps =
  ; SCPI parser (W-E12): v2.3 plus two build fixes (strings.h, -Wdouble-promotion), pinned
  ; by commit (S-20). Only the library core is used, no example code (issue #174).
  https://github.com/j123b567/scpi-parser.git#886615902b2777b71860445305bfe5a3faef4f3e
  ; REST and WebSocket JSON (ARBEITSPLAN 3.3, W-S8), exact version (S-20).
  bblanchon/ArduinoJson@7.4.3
build_src_filter =
  -<*>
  +<core/app_controller.cpp>
  +<drivers/backlight.cpp>
  +<drivers/display_detect.cpp>
  +<drivers/touch_filter.cpp>
  +<drivers/si5351_manager.cpp>
  +<drivers/si5351_plan.cpp>
  +<hal/i2c_bus.cpp>
  +<net/net_settings.cpp>
  +<net/pbkdf2.cpp>
  +<net/request_guard.cpp>
  +<net/scan_list.cpp>
  +<net/web_limits.cpp>
  +<net/web_state.cpp>
  +<net/wifi_policy.cpp>
  +<remote/>
  -<remote/scpi_tcp_server.cpp>
  +<services/>
  +<utils/contrast.cpp>
  +<utils/frequency_utils.cpp>
  +<utils/input_logic.cpp>
  +<utils/message_queue.cpp>
  +<utils/status_text.cpp>
  +<utils/touch_cal.cpp>
  +<utils/sanitize.cpp>
  +<utils/touch_test.cpp>
  +<utils/logger.cpp>
build_flags =
  -std=gnu++11
  -Wall
  -I include
  -I test/fakes
  -DSCPI_USER_CONFIG=1
  -D__USE_MINGW_ANSI_STDIO=1
  -DUNITY_INCLUDE_DOUBLE
  -DUNITY_SUPPORT_64

[env:native]
extends = native_test
platform = native
test_ignore = test_fault_iq

[env:native-win]
extends = native_test
platform = windows_x86
; scpi-parser marks internal functions hidden, which PE/MinGW cannot do and warns about.
build_flags =
  ${native_test.build_flags}
  -Wno-attributes
test_ignore = test_fault_iq

; The firmware on Arduino 3.x is C++20 (gnu++2a); this env builds the host tests the same way.
; Linux/CI only: the MinGW of windows_x86 is GCC 5.1 and knows no C++20.
[env:native-cpp20]
extends = native_test
platform = native
build_unflags = -std=gnu++11
build_flags =
  ${native_test.build_flags}
  -std=gnu++20
  -Wextra
test_ignore = test_fault_iq

; IQ error state: the driver refuses the IQ pair at 270° (TEST_FAULT_IQ), only test_fault_iq.
[native_fault]
extends = native_test
build_flags =
  ${native_test.build_flags}
  -DTEST_FAULT_IQ=1
test_filter = test_fault_iq

[env:native-fault]
extends = native_fault
platform = native

[env:native-win-fault]
extends = native_fault
platform = windows_x86
build_flags =
  ${native_fault.build_flags}
  -Wno-attributes
