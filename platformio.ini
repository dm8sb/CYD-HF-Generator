[env:esp32-2432S028R]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@8.3.11
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  https://github.com/osmanovv/esp32-si5351.git

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -I .
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=13
  -DTFT_MISO=12
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  ; Silences TFT_eSPI's optional touch warning. Actual touch is handled by
  ; PaulStoffregen/XPT2046_Touchscreen on VSPI, not by TFT_eSPI.
  -DTOUCH_CS=33
  -DUSE_HSPI_PORT
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DSMOOTH_FONT

board_build.partitions = huge_app.csv
