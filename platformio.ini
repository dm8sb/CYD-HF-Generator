; The two CYD variants differ only in the display controller; select the matching
; environment when building. Without -e, PlatformIO builds and flashes only
; default_envs (otherwise every environment in turn, leaving the last one on the board).
; Host unit tests: pio test -e native (Linux/macOS/CI, gcc in PATH) or
; pio test -e native-win (Windows, PlatformIO's bundled MinGW).
[platformio]
default_envs = esp32-2432S028R

; Shared settings of the ESP32 builds.
[esp32]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@8.3.11
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -I .
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=13
  -DTFT_MISO=12
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  ; Silences TFT_eSPI's optional touch warning. Actual touch is handled by
  ; PaulStoffregen/XPT2046_Touchscreen on VSPI, not by TFT_eSPI.
  -DTOUCH_CS=33
  -DUSE_HSPI_PORT
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DSMOOTH_FONT

board_build.partitions = huge_app.csv
; The tests in test/ run on the host only.
test_ignore = *

; Original CYD: single micro-USB port, ILI9341 controller.
[env:esp32-2432S028R]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DILI9341_DRIVER=1

; CYD2USB: additional USB-C port, ST7789 controller.
[env:esp32-2432S028R-usbc]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_OFF

; Host unit tests: the hardware-independent sources run against the fakes in
; test/fakes (Arduino core, Wire with an SI5351 register model, Preferences).
[native_test]
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<core/app_controller.cpp>
  +<drivers/backlight.cpp>
  +<drivers/si5351_manager.cpp>
  +<services/>
  +<utils/frequency_utils.cpp>
  +<utils/logger.cpp>
build_flags =
  -std=gnu++11
  -Wall
  -I include
  -I test/fakes
  -D__USE_MINGW_ANSI_STDIO=1
  -DUNITY_INCLUDE_DOUBLE
  -DUNITY_SUPPORT_64

[env:native]
extends = native_test
platform = native

[env:native-win]
extends = native_test
platform = windows_x86
