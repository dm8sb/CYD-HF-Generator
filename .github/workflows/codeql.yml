# CodeQL code scanning (ARBEITSPLAN G4): firmware C/C++ without a build (build-mode: none,
# the ESP32 toolchain and libraries are not installed), the Python host tools, the web UI in
# data/www and the workflows themselves. Query suite security-extended: the device is reachable
# over WiFi, SCPI/TCP and HTTP, so the broader security queries are worth their few extra
# false positives; the quality queries are left out (style is covered by -Wall -Wextra).
# Actions are pinned by commit SHA (W-S24, audit S-20, S-27); the token is read-only except
# for uploading the results.
name: CodeQL

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 04:23 UTC: new queries find old code. Runs only on the default branch.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - .pio
              - test/fuzz/corpus
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
