# Host unit tests (Linux, gcc), firmware build and firmware size report (G7).
# Actions are pinned by commit SHA (audit S-20, S-27); the token is read-only.
name: CI

on:
  # Pushes only on the working branches (D49): main, dev and the agent branches; tags run only
  # in release.yml. Pull requests to main always (the ruleset requires the checks), to dev for
  # Dependabot.
  push:
    branches: [main, dev, "agent/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request and event; a newer push cancels the older run, except on
# main, where every merge keeps its complete run (AF21, OPS-2).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PLATFORMIO_VERSION: "6.2.0"

jobs:
  host-tests:
    # Required check in the ruleset of main: keep the name.
    name: Host tests (native)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AF27: the local WiFi credentials of test builds and Python caches are never versioned.
      - name: Check tracked files
        run: |
          bad="$(git ls-files -- include/test_wifi_local.h '*.pyc' '*__pycache__*')"
          if [ -n "$bad" ]; then printf 'must not be tracked:\n%s\n' "$bad" >&2; exit 1; fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-native-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"
      - name: Host unit tests
        run: pio test -e native
      - name: Host tests of the IQ error state
        run: pio test -e native-fault
      # The firmware on Arduino 3.x is C++20: the host tests in the same standard. -Werror: a
      # warning in the tested sources, the tests or the fakes fails the job (AF24).
      - name: Host tests in C++20
        run: pio test -e native-cpp20

  # Not a required check (AF24): the touch log build and the host screen renderer of
  # tools/render_images.py must keep compiling; the touch log build also without warnings.
  test-builds:
    name: Test builds (touchlog, screens)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-esp32-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"
      - name: Build touch log firmware
        run: |
          set -o pipefail
          pio run -e esp32-2432S028R-touchlog 2>&1 | tee touchlog.log
          if grep -E '^(src|include)/[^:]+:[0-9]+:([0-9]+:)? warning:' touchlog.log; then
            echo "::error::compiler warnings in src/ or include/ (gate: 0)"
            exit 1
          fi
      - name: Build the host screen renderer
        run: pio run -e screens

  firmware:
    # Required check in the ruleset of main: keep the name.
    name: Firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # G7: size.json of an earlier run as the baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-esp32-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"
      # The logs let the size report cross-check its numbers with PlatformIO's (G7).
      - name: Build firmware
        run: |
          set -o pipefail
          mkdir -p size-logs
          pio run -e esp32-2432S028R 2>&1 | tee size-logs/esp32-2432S028R.log
      # The touch test build (hit map + touch log) must keep compiling.
      - name: Build touch test firmware
        run: |
          set -o pipefail
          mkdir -p logs
          pio run -e esp32-2432S028R-hitmap 2>&1 | tee logs/esp32-2432S028R-hitmap.log
      # AF24: the own sources stay at 0 warnings (-Wall -Wextra via build_src_flags; libraries
      # keep their defaults and are not checked).
      - name: Zero-warning gate
        run: |
          if grep -E '^(src|include)/[^:]+:[0-9]+:([0-9]+:)? warning:' size-logs/esp32-2432S028R.log logs/esp32-2432S028R-hitmap.log; then
            echo "::error::compiler warnings in src/ or include/ (gate: 0)"
            exit 1
          fi
          echo "no compiler warnings in src/ or include/"
      # Audit T-16: the image must carry the checked-out commit without the dirty mark.
      - name: Check build information
        run: |
          commit="$(git rev-parse --short HEAD)"
          bin=.pio/build/esp32-2432S028R/firmware.bin
          grep -a -q -- "$commit" "$bin" || { echo "commit $commit not found in $bin"; exit 1; }
          if grep -a -q -- "$commit+" "$bin"; then echo "image is marked dirty"; exit 1; fi
          echo "build information OK: $commit"
      # G7: Flash and static RAM of the firmware as job summary and artifact (tools/size_report.py).
      - name: Measure firmware size
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: >-
          python tools/size_report.py measure --github
          -e esp32-2432S028R
          --log-dir size-logs --commit "$COMMIT" --ref "$REF" -o size.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-size
          path: size.json
          if-no-files-found: error
          retention-days: 90
      # Baseline without an extra build, only the size.json artifact of an earlier run:
      # pull request = latest successful push run on the target branch; push = the successful
      # run of the previous head (event "before", for a new branch the parent commit).
      - name: Size report
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          label=""
          reason=""
          run=""
          query='.[0] | "\(.databaseId) \(.headSha)"'
          if [ "$EVENT" = "pull_request" ]; then
            what="\`$BASE_REF\`"
            target="$what"
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BASE_REF" \
              --event push --status success --limit 1 --json databaseId,headSha --jq "$query" || true)"
          elif [ "$EVENT" = "push" ]; then
            commit="$BEFORE"
            if [ -z "$commit" ] || [ "$commit" = "0000000000000000000000000000000000000000" ]; then
              commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.parents[0].sha' || true)"
            fi
            what="previous commit"
            target="$what \`${commit:0:7}\`"
            if [ -n "$commit" ]; then
              run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$commit" \
                --status success --limit 1 --json databaseId,headSha --jq "$query" || true)"
            fi
          else
            reason="not compared for $EVENT runs"
          fi
          id="${run%% *}"
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            sha="${run##* }"
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n firmware-size -D baseline; then
              label="$what @ \`${sha:0:7}\` ([run $id]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id))"
            else
              reason="run $id of $target has no firmware-size artifact (before G7 or expired)"
            fi
          elif [ -z "$reason" ]; then
            reason="no successful CI run of $target"
          fi
          python tools/size_report.py report size.json --baseline baseline/size.json \
            --baseline-label "$label" --no-baseline-reason "$reason" | tee -a "$GITHUB_STEP_SUMMARY"
