# Release (ARBEITSPLAN G1) and web flasher on GitHub Pages (G2).
# Tag v*: build both envs, GitHub release with the firmware of both envs, the flash parts of the
# flasher env and SHA256SUMS, build provenance (W-S24); final tags (without "-") also deploy the
# flasher site. Manual run: build and assemble, deploy only with the input "deploy".
# The flasher writes the parts separately (no merged image from 0: it would erase NVS on every
# update); the offsets come from PlatformIO (tools/flasher_site.py collect).
# Actions are pinned by commit SHA (audit S-20, S-27); the token is read-only except in the
# release and deploy jobs.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the flasher site to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLATFORMIO_VERSION: "6.2.0"
  # The env behind the web flasher and the flash parts of the release (Arduino core 3, E-32).
  FLASHER_ENV: esp32-2432S028R

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      deploy: ${{ steps.v.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from the tag or APP_VERSION
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        run: |
          app="$(sed -n 's/^#define APP_VERSION "\([^"]*\)".*/\1/p' include/config.h)"
          [ -n "$app" ] || { echo "APP_VERSION not found in include/config.h" >&2; exit 1; }
          commit="$(git rev-parse --short HEAD)"
          prerelease=false
          deploy=false
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            # v1.4.0 or v1.4.0-rc1 for APP_VERSION 1.4.0, nothing else.
            case "$version" in
              "$app") ;;
              "$app"-*) prerelease=true ;;
              *) echo "tag $REF_NAME does not match APP_VERSION $app" >&2; exit 1 ;;
            esac
            # A pushed final tag replaces the public flasher; a release candidate does not.
            [ "$EVENT" = push ] && [ "$prerelease" = false ] && deploy=true
          else
            version="$app-dev.$commit"
          fi
          case "$version" in *[!0-9A-Za-z.+-]*) echo "bad version $version" >&2; exit 1 ;; esac
          [ "$DEPLOY_INPUT" = true ] && deploy=true
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "prerelease=$prerelease"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, commit $commit, prerelease $prerelease, deploy $deploy" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        env: [esp32-2432S028R]
    env:
      ENV_NAME: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-release-${{ matrix.env }}-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-release-${{ matrix.env }}-${{ env.PLATFORMIO_VERSION }}-
            pio-esp32-${{ env.PLATFORMIO_VERSION }}-
      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"
      - name: Build firmware
        run: pio run -e "$ENV_NAME"
      # Audit T-16: the image carries the checked-out commit without the dirty mark.
      - name: Check build information
        run: |
          commit="$(git rev-parse --short HEAD)"
          bin=".pio/build/$ENV_NAME/firmware.bin"
          grep -a -q -- "$commit" "$bin" || { echo "commit $commit not found in $bin"; exit 1; }
          if grep -a -q -- "$commit+" "$bin"; then echo "image is marked dirty"; exit 1; fi
          echo "build information OK: $commit"
      # Offsets and paths (bootloader, partition table, boot_app0 from the framework package,
      # application) as PlatformIO's upload command uses them.
      - name: Collect flash parts
        run: |
          pio project metadata -e "$ENV_NAME" --json-output > metadata.json
          python tools/flasher_site.py collect --metadata metadata.json --env "$ENV_NAME" --out "parts/$ENV_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.env }}
          path: parts/${{ matrix.env }}/
          if-no-files-found: error
          retention-days: 30

  site:
    name: Flasher site
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ env.FLASHER_ENV }}
          path: parts/
      - name: Assemble and check the site
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ needs.meta.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          python3 tools/flasher_site.py assemble --parts parts --version "$VERSION" --commit "$COMMIT" --repo "$REPO" --out site
          python3 tools/flasher_site.py check site --verify-cdn | tee check.log
          { echo '### Flasher site'; echo '```'; cat check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: [meta, site]
    if: needs.meta.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: GitHub release
    needs: [meta, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: builds/
      - name: Name the release files
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir release
          prefix="cyd-hf-generator-$VERSION"
          for dir in builds/build-*; do
            env_name="${dir#builds/build-}"
            cp "$dir/firmware.bin" "release/$prefix-$env_name-firmware.bin"
          done
          for part in bootloader partitions boot_app0; do
            cp "builds/build-$FLASHER_ENV/$part.bin" "release/$prefix-$FLASHER_ENV-$part.bin"
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.bin
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ needs.meta.outputs.commit }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          prefix="cyd-hf-generator-$VERSION-$FLASHER_ENV"
          offsets="$(python3 -c 'import json,sys; [print("0x%X %s" % (p["offset"], p["file"])) for p in json.load(open(sys.argv[1]))["parts"]]' "builds/build-$FLASHER_ENV/parts.json")"
          cat > notes.md <<EOF
          Firmware $VERSION (commit \`$COMMIT\`) for the ESP32-2432S028R (CYD and CYD2USB).

          **Web flasher** (Chrome/Edge on a desktop): $PAGES_URL

          | File | Content |
          |---|---|
          | \`$prefix-firmware.bin\` | Application at 0x10000 (the build behind the web flasher) |
          | \`$prefix-bootloader.bin\`, \`-partitions.bin\`, \`-boot_app0.bin\` | Flash parts of the same build |
          | \`SHA256SUMS\` | Checksums; provenance: \`gh attestation verify <file> --repo $GH_REPO\` |

          Offsets (PlatformIO upload):
          \`\`\`
          $offsets
          \`\`\`
          Install or update with esptool (does not erase NVS: touch calibration, correction and WiFi stay):
          \`\`\`
          esptool.py --chip esp32 write_flash 0x1000 $prefix-bootloader.bin 0x8000 $prefix-partitions.bin 0xe000 $prefix-boot_app0.bin 0x10000 $prefix-firmware.bin
          \`\`\`
          EOF
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "CYD HF Generator $VERSION" --notes-file notes.md "${flags[@]}"
          fi
