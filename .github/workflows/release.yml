# Release (ARBEITSPLAN G1) and web flasher on GitHub Pages (G2, G11) with the manual (DE, EN),
# the hardware page and the remote API rendered from the Markdown at the tag (G9, E-903).
# Tag v*: the tagged commit must be on main and pass the host tests (AF7, OPS-4/5, TEST-3); then
# build, GitHub release with the firmware, the flash parts of the flasher env, license notices
# and LGPL sources (THIRD_PARTY_NOTICES.md) and SHA256SUMS, build provenance over all assets
# (SHA256SUMS, A-724, OPS-14). An existing release is never changed (no --clobber; the tag
# ruleset and immutable releases protect it on GitHub, E-809). Every pushed tag (also a release
# candidate, E-808) deploys the flasher site after its release, which serves ESP Web Tools itself
# (E-905). Manual run: tests, build and the assembled site as an artifact for testing; it never
# deploys (E-810, LIC-6).
# Dry run (AF23, E-807): every pull request to main, and pushes to dev or agent/** that change the
# release path, run everything except the release and the deploy; the job "Release dry run" names
# the assets and writes the notes with the same script as the release (tools/release_files.py).
# The flasher writes the parts separately (no merged image from 0: it would erase NVS on every
# update); the offsets come from PlatformIO (tools/flasher_site.py collect).
# Actions are pinned by commit SHA (audit S-20, S-27); the token is read-only except in the
# release and deploy jobs.
name: Release

on:
  push:
    tags: ["v*"]
    # Path filters apply only to the branch pushes, never to tags.
    branches: [dev, "agent/**"]
    paths:
      - .github/workflows/release.yml
      - tools/release_files.py
      - tools/flasher_site.py
      - tools/docs_site.py
      - tools/dep_check.py
      - tools/requirements-ci.txt
      - tools/advisories_accepted.json
      - flasher/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A tag run is never cancelled; a dry run is replaced by the next push to its branch or PR.
concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}

env:
  # The env behind the web flasher and the flash parts of the release (Arduino core 3, E-803).
  FLASHER_ENV: esp32-2432S028R

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      deploy: ${{ steps.v.outputs.deploy }}
      epoch: ${{ steps.v.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All branches: the tagged commit is checked against main.
          fetch-depth: 0
      - name: Version from the tag or APP_VERSION
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          app="$(sed -n 's/^#define APP_VERSION "\([^"]*\)".*/\1/p' include/config.h)"
          [ -n "$app" ] || { echo "APP_VERSION not found in include/config.h" >&2; exit 1; }
          commit="$(git rev-parse --short HEAD)"
          # Commit time as SOURCE_DATE_EPOCH (AF25): build stamp and archives depend only on the commit.
          epoch="$(git log -1 --format=%ct HEAD)"
          prerelease=false
          deploy=false
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            # v2.0.0 or v2.0.0-rc1 for APP_VERSION 2.0.0, nothing else.
            case "$version" in
              "$app") ;;
              "$app"-*) prerelease=true ;;
              *) echo "tag $REF_NAME does not match APP_VERSION $app" >&2; exit 1 ;;
            esac
            # Only what was merged to main is released (OPS-4): main reaches the tag only through
            # a pull request with green checks.
            git rev-parse --verify -q refs/remotes/origin/main > /dev/null || { echo "origin/main not fetched" >&2; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo "tag $REF_NAME ($GITHUB_SHA) is not on main" >&2; exit 1; }
            # Every pushed tag deploys the public flasher, a release candidate too (E-808); the
            # release is marked as a prerelease.
            [ "$EVENT" = push ] && deploy=true
          else
            version="$app-dev.$commit"
          fi
          case "$version" in *[!0-9A-Za-z.+-]*) echo "bad version $version" >&2; exit 1 ;; esac
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "prerelease=$prerelease"
            echo "deploy=$deploy"
            echo "epoch=$epoch"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, commit $commit, prerelease $prerelease, deploy $deploy" >> "$GITHUB_STEP_SUMMARY"

  # The host tests on the tagged commit itself (TEST-3), as in ci.yml; without a cache.
  tests:
    name: Host tests
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --require-hashes -r tools/requirements-ci.txt
      - name: Host unit tests
        run: pio test -e native
      - name: Host tests of the IQ error state
        run: pio test -e native-fault
      - name: Host tests in C++20
        run: pio test -e native-cpp20

  # Without a package cache (AF22): the release image is built from freshly downloaded packages,
  # pinned exactly in platformio.ini and checked by tools/dep_check.py.
  build:
    name: Build ${{ matrix.env }}
    needs: [meta, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        env: [esp32-2432S028R]
    env:
      ENV_NAME: ${{ matrix.env }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --require-hashes -r tools/requirements-ci.txt
      - name: Build firmware
        run: pio run -e "$ENV_NAME"
      # Audit T-16: the image carries the checked-out commit without the dirty mark.
      - name: Check build information
        env:
          # Tag builds carry the tag version (v2.0.0-rc1 -> 2.0.0-rc1), others APP_VERSION.
          VERSION: ${{ github.ref_type == 'tag' && needs.meta.outputs.version || '' }}
        run: |
          commit="$(git rev-parse --short HEAD)"
          bin=".pio/build/$ENV_NAME/firmware.bin"
          grep -a -q -- "$commit" "$bin" || { echo "commit $commit not found in $bin"; exit 1; }
          if grep -a -q -- "$commit+" "$bin"; then echo "image is marked dirty"; exit 1; fi
          # AF25: the time stamp is the commit time in UTC, the version that of the tag.
          stamp="$(date -u -d "@$SOURCE_DATE_EPOCH" '+%Y-%m-%d %H:%M UTC')"
          grep -a -q -- "$stamp" "$bin" || { echo "build time $stamp not found in $bin"; exit 1; }
          grep -a -q -- "$VERSION" "$bin" || { echo "version $VERSION not found in $bin"; exit 1; }
          echo "build information OK: $commit, $stamp, $VERSION"
      # Offsets and paths (bootloader, partition table, boot_app0 from the framework package,
      # application) as PlatformIO's upload command uses them.
      - name: Collect flash parts
        run: |
          pio project metadata -e "$ENV_NAME" --json-output > metadata.json
          python tools/flasher_site.py collect --metadata metadata.json --env "$ENV_NAME" --out "parts/$ENV_NAME"
      # AF22: the packages of this build are exactly the pinned ones and the ones the notices name;
      # the list goes into the job summary and the release notes (packages.md in the artifact).
      - name: Check pinned packages
        env:
          # E-804: the SHA-256 digests of the pinned release assets are read over the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pio pkg list -e "$ENV_NAME" > pkg-list.txt
          python tools/dep_check.py packages --pkg-list pkg-list.txt --metadata metadata.json --env "$ENV_NAME" --summary "parts/$ENV_NAME/packages.md"
          cat "parts/$ENV_NAME/packages.md" >> "$GITHUB_STEP_SUMMARY"
      # G11 (THIRD_PARTY_NOTICES.md): notices and license texts next to the binaries, the license
      # files as shipped in the pinned packages, and the source of the LGPL parts linked into the
      # image (LGPL-2.1 section 6, LGPL-3.0 section 4). A missing file fails the build, so a
      # dependency change cannot drop a notice unnoticed.
      - name: Collect notices and LGPL sources
        run: |
          python tools/flasher_site.py notices --metadata metadata.json --env "$ENV_NAME" --out "parts/$ENV_NAME/notices"
          ls -l "parts/$ENV_NAME/notices" "parts/$ENV_NAME/notices/upstream"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.env }}
          path: parts/${{ matrix.env }}/
          if-no-files-found: error
          retention-days: 30

  site:
    name: Flasher site
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ env.FLASHER_ENV }}
          path: parts/
      # markdown-it-py for the documentation pages (G9), pinned with hashes like PlatformIO.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the Markdown renderer
        run: pip install --require-hashes -r tools/requirements-ci.txt
      # ESP Web Tools is served by the site itself (E-905): the pinned modules, license files and
      # flasher stub sources of flasher/esp-web-tools.json, each checked against its hash.
      - name: Download ESP Web Tools
        run: python3 tools/flasher_site.py vendor --out ewt
      # The documentation pages come from this commit; check fails on a broken link, anchor or
      # image, so the dry run of a pull request to main catches it before the release.
      - name: Assemble and check the site
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ needs.meta.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          python3 tools/flasher_site.py assemble --parts parts --ewt ewt --version "$VERSION" --commit "$COMMIT" --repo "$REPO" --out site
          python3 tools/flasher_site.py check site | tee check.log
          { echo '### Flasher site'; echo '```'; cat check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  # Only after the release exists (rc1 went live without one) and only for a pushed tag (E-810).
  deploy:
    name: Deploy to GitHub Pages
    needs: [meta, site, release]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.meta.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # AF26, E-807: no release with an open advisory finding of a pinned dependency (the same check as
  # the weekly advisories.yml). Dry runs report the result without failing.
  advisories:
    name: Advisory check
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pinned dependencies against advisories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/dep_check.py advisories --summary "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: [meta, build, advisories]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # A release is never replaced or extended (OPS-15): a second run for the same tag stops
      # here instead of overwriting assets.
      - name: Stop if the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG exists already; it is not changed" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # By name into its own folder: with a pattern and a single match (one env since S41d)
          # the files would land directly in builds/ (an early release candidate failed on that).
          name: build-${{ env.FLASHER_ENV }}
          path: builds/build-${{ env.FLASHER_ENV }}/
      # The asset names, the deterministic licenses archive and SHA256SUMS (tools/release_files.py,
      # the same step as the dry run).
      - name: Name the release files
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
        run: python3 tools/release_files.py name --builds builds --env "$FLASHER_ENV" --version "$VERSION" --out release
      # Provenance for every asset, not only the .bin files (OPS-14).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ needs.meta.outputs.commit }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          # Notes with the offsets and the esptool command from parts.json and the release file
          # names (every part must be an asset, OPS-14) and the resolved packages (AF22).
          python3 tools/release_files.py notes --builds builds --env "$FLASHER_ENV" --version "$VERSION" --commit "$COMMIT" --tag "$TAG" --repo "$GH_REPO" --pages-url "$PAGES_URL" --packages "builds/build-$FLASHER_ENV/packages.md" --out notes.md
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          # Fails if the release appeared meanwhile: nothing is overwritten.
          gh release create "$TAG" release/* --verify-tag --title "CYD HF Generator $VERSION" --notes-file notes.md "${flags[@]}"

  # AF23: the release path without publishing (pull requests to main, pushes that change it,
  # manual runs): same artifact, same script, same checks; the assets and notes are shown in the
  # job summary and kept as an artifact. Not a required check of the ruleset.
  dry-run:
    name: Release dry run
    needs: [meta, build]
    if: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ env.FLASHER_ENV }}
          path: builds/build-${{ env.FLASHER_ENV }}/
      - name: Name the release files and write the notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ needs.meta.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
          GH_REPO: ${{ github.repository }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python3 tools/release_files.py name --builds builds --env "$FLASHER_ENV" --version "$VERSION" --out release
          python3 tools/release_files.py notes --builds builds --env "$FLASHER_ENV" --version "$VERSION" --commit "$COMMIT" --tag "v$VERSION" --repo "$GH_REPO" --pages-url "$PAGES_URL" --packages "builds/build-$FLASHER_ENV/packages.md" --out notes.md
          {
            echo '### Release dry run (nothing published)'
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            release/
            notes.md
          if-no-files-found: error
          retention-days: 7
